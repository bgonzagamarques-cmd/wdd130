<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="questionario.css">
</head>
<body>
    <main>
        <h1>Questionário de HTML e CSS</h1>
        
        <form action="#" method="post">
            <!-- Pergunta 1: Text -->
            <div>
                <label for="q1">1. O que significa a sigla CSS?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Pergunta 2: Textarea -->
            <div>
                <label for="q2">2. Como os atributos `id` e `class` são selecionados no CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <!-- Pergunta 3: Select (Comentário CSS) -->
            <div>
                <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="opcao1">&lt;-- Este é um comentário --&gt;</option>
                    <option value="opcao2">/* Este é um comentário */</option>
                    <option value="opcao3">// Este é um comentário</option>
                </select>
            </div>

            <!-- Pergunta 4: Number -->
            <div>
                <label for="q4">4. Quantos pixels compõem a margem superior na regra <code>margin: 10px 5px 15px;</code>?</label>
                <input type="number" id="q4" name="q4" required>
            </div>

            <!-- Botão de Envio -->
            <button type="submit">Enviar Questionário</button>
        </form>
    </main>
</body>
</html>
